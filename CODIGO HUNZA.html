<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunza Care - Seguimiento de Pacientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');

        :root {
            --bg:             #f4efe6;
            --surface:        #ffffff;
            --primary:        #2a4a3c;
            --primary-hover:  #1e3a2e;
            --primary-dim:    #3d6557;
            --primary-light:  #e5eeea;
            --accent:         #c49a54;
            --accent-light:   #f5e8d0;
            --text:           #1a2820;
            --text-mid:       #3d5247;
            --text-muted:     #6c7e75;
            --border:         #ddd6c9;
            --border-green:   #c5d8cf;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        .font-serif { font-family: 'Playfair Display', serif; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #eee9df; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c8c0b4; border-radius: 10px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c7e75' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
            padding-right: 2rem !important;
        }

        /* Transición de vistas */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .view-enter { animation: fadeUp 0.32s cubic-bezier(0.22,1,0.36,1) both; }

        /* FAQ suave con grid */
        .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
        .faq-body.open { grid-template-rows: 1fr; }
        .faq-body > div { overflow: hidden; }

        /* Progress fill animation */
        .progress-fill { transition: width 1.1s cubic-bezier(0.22,1,0.36,1); }

        /* Badge prioridades */
        .badge-red    { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
        .badge-yellow { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
        .badge-green  { background:#ecfdf5; color:#15803d; border:1px solid #a7f3d0; }

        /* Pulso tarjeta urgente */
        @keyframes ring-pulse {
            0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.16); }
            50%      { box-shadow:0 0 0 6px rgba(220,38,38,0); }
        }
        .card-urgent { animation: ring-pulse 2.4s ease-in-out infinite; }

        /* Stage step */
        .stage-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

        /* Bottom nav */
        .pb-nav { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
        .bottom-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

        /* Sidebar item hover */
        .sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; font-size:13px; font-weight:500; transition:all .18s; cursor:pointer; }
        .sidebar-item:hover { background:rgba(255,255,255,.1); }
        .sidebar-item.active { background:rgba(255,255,255,.18); }

        /* Avatar */
        .avatar { display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:600; letter-spacing:.02em; flex-shrink:0; }

        /* Btn shimmer */
        .btn-shine { position:relative; overflow:hidden; }
        .btn-shine::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 60%); pointer-events:none; }

        /* Quick-access card */
        .quick-card { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; background:var(--surface); border:1px solid var(--border); border-radius:18px; cursor:pointer; transition:all .18s; }
        .quick-card:hover { border-color:var(--border-green); background:var(--primary-light); }
        .quick-card:active { transform:scale(.96); }
    </style>
</head>
<body class="antialiased min-h-screen">
    <div id="app"></div>

    <script>
        // --- ESTADO ---
        let view = 'login';
        let selectedPatientId = null;
        let chartInstance = null;
        let chartFilters = { period: 'mensual', month: '5' };

        const mesesNombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        let patientsData = [
            {
                id: 1,
                name: 'Valentina Soto',
                procedure: 'Liposucción Láser Ambulatoria',
                stage: 'Semana 2 — Kinesiología Postoperatoria',
                priority: 'yellow',
                nextControl: '28/05/2026',
                pendingAppointment: 'Sesión de Drenaje Linfático (Semana 2)',
                currentMilestone: 2,
                currentDay: 14,
                totalDays: 180,
                milestones: [
                    { day:'Día 1',    title:'Procedimiento',    desc:'Cirugía ambulatoria. Reposo y cuidados iniciales.', completed:true  },
                    { day:'Día 7',    title:'Uso de Faja',      desc:'Uso estricto de faja y postura por 10 a 14 días.', completed:true  },
                    { day:'Semana 2', title:'Drenaje Linfático',desc:'Inicio de 8 a 12 sesiones de kinesiología.',       completed:false },
                    { day:'Mes 1',    title:'Reducción 40%',    desc:'Desinflamación visible del 40-50%.',               completed:false },
                    { day:'Mes 3',    title:'Resultado 80%',    desc:'Resultado avanzado y moldeado evidente.',          completed:false },
                    { day:'Mes 6',    title:'Alta Definitiva',  desc:'Resultado final y definitivo.',                   completed:false },
                ],
                faqs: [
                    { q:'¿Debo usar faja de compresión?',                  a:'Sí, es obligatorio. Se recomiendan cuidados exhaustivos de uso de faja y postura de 10 a 14 días para asegurar la mejor recuperación.' },
                    { q:'¿Cuántas sesiones de drenaje linfático necesito?',a:'Se recomiendan entre 8 y 12 sesiones distribuidas en las primeras semanas para eliminar líquidos y reducir el edema.' },
                    { q:'¿Cuándo puedo retomar mis actividades?',          a:'La mayoría de los pacientes puede retomar actividades diarias ligeras en una semana.' }
                ],
                quote: 'La paciencia y la disciplina en tus cuidados son las claves de resultados extraordinarios.'
            },
            {
                id: 2,
                name: 'Camila Ríos',
                procedure: 'DRAWNFACE (Marcación Mandibular)',
                stage: 'Día 5 — Asentamiento',
                priority: 'green',
                nextControl: '22/05/2026',
                pendingAppointment: null,
                currentMilestone: 1,
                currentDay: 5,
                totalDays: 90,
                milestones: [
                    { day:'Día 1',   title:'Procedimiento',   desc:'Definición del ángulo mandibular.',                         completed:true  },
                    { day:'Día 3-7', title:'Desinflamación',  desc:'Disminución del edema inicial.',                            completed:false },
                    { day:'Mes 1',   title:'Efecto Tensor',   desc:'Producción de colágeno y efecto tensor visible.',           completed:false },
                    { day:'Mes 3',   title:'Resultado Final', desc:'Perfil completamente definido y armónico.',                 completed:false },
                ],
                faqs: [
                    { q:'¿Es normal sentir tensión en el cuello?',    a:'Sí, es completamente normal durante los primeros días mientras el tejido se adapta a la estimulación láser.' },
                    { q:'¿Cuándo veré el resultado definitivo?',      a:'El resultado definitivo se aprecia hacia el tercer mes por la producción de colágeno.' }
                ],
                quote: 'Descubre cómo un perfil definido puede potenciar tu confianza.'
            },
            {
                id: 3,
                name: 'Sofía Araneda',
                procedure: 'Armonización Facial Completa',
                stage: 'Día 1 — Inflamación Inicial',
                priority: 'red',
                nextControl: '18/05/2026',
                pendingAppointment: 'Control Primeras 48 Hrs',
                currentMilestone: 0,
                currentDay: 1,
                totalDays: 365,
                milestones: [
                    { day:'Día 1',    title:'Aplicación',     desc:'Relleno de ojeras o pómulos. Inflamación.',                completed:true  },
                    { day:'Día 3',    title:'Baja Edema',     desc:'Reducción de hinchazón o posibles hematomas.',             completed:false },
                    { day:'Semana 2', title:'Asentamiento',   desc:'El ácido hialurónico se integra al tejido.',               completed:false },
                    { day:'Mes 12',   title:'Re-evaluación',  desc:'El producto comienza a reabsorberse.',                    completed:false },
                ],
                faqs: [
                    { q:'¿Puedo hacer ejercicio hoy?',                     a:'Se recomienda evitar el ejercicio intenso, saunas y exposición solar directa durante las primeras 48 horas.' },
                    { q:'Apareció un pequeño moretón, ¿es normal?',       a:'Sí, al ser un procedimiento inyectable pueden surgir pequeños hematomas que desaparecerán en 3 a 5 días.' }
                ],
                quote: 'Armonía, volumen y luz para tu rostro.'
            },
        ];

        // --- UTILIDADES ---
        function getInitials(n) { return n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }
        function priorityLabel(p) { return {red:'Urgente',yellow:'Seguimiento',green:'Estable'}[p]; }

        function svgCircleProgress(pct, size=72, sw=5) {
            const r = (size-sw)/2, c = 2*Math.PI*r;
            const dash = (pct/100*c).toFixed(2), gap = (c-pct/100*c).toFixed(2);
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="${sw}"/>
                <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#c49a54" stroke-width="${sw}"
                    stroke-dasharray="${dash} ${gap}" stroke-linecap="round"
                    transform="rotate(-90 ${size/2} ${size/2})"/>
                <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
                    fill="white" font-size="13" font-weight="700" font-family="Montserrat,sans-serif">${pct}%</text>
            </svg>`;
        }

        // --- LÓGICA ---
        function sortPatients() {
            const w={red:1,yellow:2,green:3};
            patientsData.sort((a,b)=>w[a.priority]-w[b.priority]);
        }

        function setView(newView) {
            view = newView;
            render();
            if (view==='doctor') setTimeout(initChart,50);
        }

        function loginAsPatient(id) { selectedPatientId=id; setView('patient'); }

        function setPriority(patientId, newPriority) {
            const p = patientsData.find(p=>p.id===patientId);
            if(p){ p.priority=newPriority; render(); if(view==='doctor') setTimeout(initChart,50); }
        }

        function toggleFAQ(el) {
            const body=el.nextElementSibling, icon=el.querySelector('svg');
            body.classList.toggle('open');
            icon.style.transform = body.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function handleFilterChange() {
            chartFilters.period = document.getElementById('periodFilter').value;
            chartFilters.month  = document.getElementById('monthFilter').value;
            const ms = document.getElementById('monthFilter');
            if(chartFilters.period==='anual'){ ms.disabled=true; ms.classList.add('opacity-40','cursor-not-allowed'); }
            else { ms.disabled=false; ms.classList.remove('opacity-40','cursor-not-allowed'); }
            initChart();
        }

        // --- GRÁFICO ---
        function initChart() {
            const ctx = document.getElementById('proceduresChart');
            if(!ctx) return;
            if(chartInstance) chartInstance.destroy();
            let labels=[], data=[], chartTitle='';
            const mf = parseInt(chartFilters.month)/10+0.5;
            if(chartFilters.period==='anual'){
                labels=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
                data=[120,140,115,160,185,170,200,220,190,210,250,280];
                chartTitle='Total Procedimientos Anuales';
            } else if(chartFilters.period==='mensual'){
                labels=['Lipo Láser','Drawn Face','Armonización','Toxina B.','Lipomarcación'];
                data=[45,25,30,50,15].map(v=>Math.round(v*mf));
                chartTitle=`Procedimientos — ${mesesNombres[parseInt(chartFilters.month)-1]}`;
            } else {
                labels=['Lun','Mar','Mié','Jue','Vie','Sáb'];
                data=[8,5,12,10,16,7].map(v=>Math.round(v*mf));
                chartTitle=`Flujo Diario — ${mesesNombres[parseInt(chartFilters.month)-1]}`;
            }
            chartInstance = new Chart(ctx, {
                type:'bar',
                data:{ labels, datasets:[{ label:chartTitle, data, backgroundColor:'#2a4a3c', borderRadius:8, barThickness:chartFilters.period==='anual'?12:22 }] },
                options:{
                    responsive:true, maintainAspectRatio:false,
                    animation:{duration:450,easing:'easeOutQuart'},
                    plugins:{
                        legend:{display:false},
                        tooltip:{ backgroundColor:'#1e3a2e', padding:10, cornerRadius:10, callbacks:{ label:c=>` ${c.parsed.y} procedimientos` } }
                    },
                    scales:{
                        y:{ beginAtZero:true, grid:{borderDash:[4,4],color:'#ede8df'}, border:{display:false}, ticks:{color:'#9aada5',font:{size:10}} },
                        x:{ grid:{display:false}, border:{display:false}, ticks:{color:'#9aada5',font:{size:10}} }
                    }
                }
            });
        }

        // --- RENDER ---
        function render() {
            const app=document.getElementById('app');
            if(view==='login')   app.innerHTML=getLoginHTML();
            else if(view==='doctor')  app.innerHTML=getDoctorHTML();
            else if(view==='patient') app.innerHTML=getPatientHTML();
            lucide.createIcons();
        }

        // ============================================================
        // 1. LOGIN
        // ============================================================
        function getLoginHTML() {
            return `
            <div class="min-h-screen flex items-center justify-center p-4"
                 style="background:linear-gradient(160deg,#1e3a2e 0%,#2a4a3c 55%,#f4efe6 55%)">

                <div class="view-enter w-full max-w-sm flex flex-col gap-4">

                    <!-- Branding card -->
                    <div class="bg-white/10 backdrop-blur-sm rounded-3xl px-7 pt-7 pb-5 text-white text-center">
                        <div class="flex items-center justify-center gap-2 mb-4">
                            <div style="background:rgba(196,154,84,.25);border-radius:12px;padding:10px;">
                                <i data-lucide="leaf" style="width:22px;height:22px;color:#c49a54;"></i>
                            </div>
                        </div>
                        <p class="text-[10px] tracking-[0.3em] uppercase font-medium text-green-300 mb-1">Clínica</p>
                        <h1 class="font-serif text-4xl font-semibold mb-1 text-white">HUNZA</h1>
                        <p class="text-[11px] tracking-[0.2em] uppercase text-green-300/80">Medicina Estética con Base Médica</p>
                    </div>

                    <!-- Login card -->
                    <div class="bg-white rounded-3xl shadow-xl p-6" style="border:1px solid #ddd6c9;">

                        <!-- Doctor -->
                        <button onclick="setView('doctor')"
                            class="btn-shine w-full py-3.5 px-4 rounded-2xl font-semibold text-sm flex items-center justify-center gap-2 mb-5 shadow-lg"
                            style="background:#2a4a3c;color:white;">
                            <i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i>
                            Dashboard · Dra. Macarena
                        </button>

                        <!-- Divisor -->
                        <div class="relative mb-4">
                            <div class="absolute inset-0 flex items-center"><div class="w-full" style="border-top:1px solid #e5dfd5;"></div></div>
                            <div class="relative flex justify-center">
                                <span class="bg-white px-3 text-[11px] uppercase tracking-widest font-medium" style="color:#9aada5;">Acceso Pacientes</span>
                            </div>
                        </div>

                        <!-- Pacientes -->
                        <div class="flex flex-col gap-2">
                            ${patientsData.map(p=>`
                            <button onclick="loginAsPatient(${p.id})"
                                class="group w-full py-3 px-4 rounded-2xl transition-all flex items-center gap-3"
                                style="background:#f4efe6;border:1px solid #ddd6c9;">
                                <div class="avatar w-9 h-9 text-sm ${p.priority==='red'?'bg-red-100 text-red-700':p.priority==='yellow'?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-800'}">
                                    ${getInitials(p.name)}
                                </div>
                                <div class="flex-1 text-left min-w-0">
                                    <p class="font-semibold text-sm truncate" style="color:#1a2820;">${p.name}</p>
                                    <p class="text-[11px] truncate" style="color:#9aada5;">${p.procedure}</p>
                                </div>
                                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ${p.priority==='red'?'badge-red':p.priority==='yellow'?'badge-yellow':'badge-green'}">
                                    ${priorityLabel(p.priority)}
                                </span>
                            </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Valores -->
                    <div class="grid grid-cols-4 gap-2 px-1">
                        ${['Ética','Responsabilidad','Conocimiento','Cordialidad'].map(v=>`
                        <div class="text-center">
                            <p class="text-[10px] font-medium" style="color:rgba(255,255,255,.5);">${v}</p>
                        </div>`).join('')}
                    </div>
                </div>
            </div>`;
        }

        // ============================================================
        // 2. DASHBOARD MÉDICO
        // ============================================================
        function getDoctorHTML() {
            sortPatients();
            const total=patientsData.length;
            const urgentes=patientsData.filter(p=>p.priority==='red').length;
            const estables=patientsData.filter(p=>p.priority==='green').length;

            const sidebarItems = [
                {icon:'layout-dashboard', label:'Panel', active:true},
                {icon:'activity',         label:'Evolución'},
                {icon:'calendar',         label:'Citas'},
                {icon:'file-text',        label:'Documentos'},
                {icon:'message-circle',   label:'Mensajes'},
                {icon:'settings',         label:'Indicaciones'},
            ];

            return `
            <div class="min-h-screen flex view-enter" style="background:#f4efe6;">

                <!-- Sidebar (desktop) -->
                <aside class="hidden md:flex flex-col w-56 fixed top-0 left-0 h-screen z-30 pt-7 pb-5"
                       style="background:#2a4a3c;">
                    <!-- Logo -->
                    <div class="px-5 mb-8">
                        <div class="flex items-center gap-2.5">
                            <div style="background:rgba(196,154,84,.2);border-radius:10px;padding:7px;">
                                <i data-lucide="leaf" style="width:16px;height:16px;color:#c49a54;"></i>
                            </div>
                            <div>
                                <p class="font-serif text-lg font-semibold text-white leading-none">HUNZA</p>
                                <p class="text-[9px] text-green-300/70 tracking-widest uppercase">Clínica</p>
                            </div>
                        </div>
                    </div>
                    <!-- Nav -->
                    <nav class="flex-1 px-3 flex flex-col gap-1">
                        ${sidebarItems.map(i=>`
                        <div class="sidebar-item${i.active?' active':''}" style="color:${i.active?'white':'rgba(255,255,255,.55)'};">
                            <i data-lucide="${i.icon}" style="width:16px;height:16px;flex-shrink:0;"></i>
                            <span>${i.label}</span>
                        </div>`).join('')}
                    </nav>
                    <!-- Perfil -->
                    <div class="px-3 pt-4" style="border-top:1px solid rgba(255,255,255,.1);">
                        <div class="flex items-center gap-3 px-3 py-2">
                            <div class="avatar w-9 h-9 text-sm" style="background:rgba(255,255,255,.15);color:white;">MG</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold text-white truncate">Dra. Macarena</p>
                                <p class="text-[10px]" style="color:rgba(255,255,255,.45);">Directora Médica</p>
                            </div>
                        </div>
                        <button onclick="setView('login')" class="sidebar-item w-full mt-1" style="color:rgba(255,255,255,.45);">
                            <i data-lucide="log-out" style="width:15px;height:15px;"></i>
                            <span>Cerrar sesión</span>
                        </button>
                    </div>
                </aside>

                <!-- Mobile header -->
                <header class="md:hidden fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 py-3.5 shadow-sm"
                        style="background:#2a4a3c;">
                    <div class="flex items-center gap-2">
                        <i data-lucide="leaf" style="width:16px;height:16px;color:#c49a54;"></i>
                        <span class="font-serif text-white text-base font-semibold">HUNZA</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="avatar w-8 h-8 text-xs" style="background:rgba(255,255,255,.15);color:white;">MG</div>
                        <button onclick="setView('login')" style="color:rgba(255,255,255,.6);padding:6px;">
                            <i data-lucide="log-out" style="width:16px;height:16px;"></i>
                        </button>
                    </div>
                </header>

                <!-- Contenido principal -->
                <main class="flex-1 md:ml-56 pt-16 md:pt-0 pb-10">
                    <div class="max-w-4xl mx-auto px-4 py-6">

                        <!-- Titulo -->
                        <div class="mb-6">
                            <h2 class="font-serif text-2xl" style="color:#1a2820;">Panel de monitoreo</h2>
                            <p class="text-sm" style="color:#6c7e75;">Visión general de tus pacientes activos</p>
                        </div>

                        <div class="flex flex-col md:flex-row gap-5">

                            <!-- Columna izquierda -->
                            <div class="w-full md:w-80 flex flex-col gap-4 shrink-0">

                                <!-- Stats -->
                                <div class="grid grid-cols-3 gap-3">
                                    <div class="rounded-2xl p-4 bg-white" style="border:1px solid #ddd6c9;">
                                        <div class="w-7 h-7 rounded-xl flex items-center justify-center mb-2"
                                             style="background:#e5eeea;">
                                            <i data-lucide="users" style="width:14px;height:14px;color:#2a4a3c;"></i>
                                        </div>
                                        <p class="text-2xl font-serif" style="color:#1a2820;">${total}</p>
                                        <p class="text-[10px] font-medium mt-0.5" style="color:#9aada5;">Activos</p>
                                    </div>
                                    <div class="rounded-2xl p-4 ${urgentes>0?'card-urgent':''}"
                                         style="background:${urgentes>0?'#fff5f5':'white'};border:1px solid ${urgentes>0?'#fecaca':'#ddd6c9'};">
                                        <div class="w-7 h-7 rounded-xl flex items-center justify-center mb-2"
                                             style="background:${urgentes>0?'#fee2e2':'#f4efe6'};">
                                            <i data-lucide="alert-circle" style="width:14px;height:14px;color:${urgentes>0?'#dc2626':'#9aada5'};"></i>
                                        </div>
                                        <p class="text-2xl font-serif" style="color:${urgentes>0?'#dc2626':'#c8bfb4'};">${urgentes}</p>

        // ============================================================
        // 3. PORTAL PACIENTE
        // ============================================================
        function getPatientHTML() {
            const p = patientsData.find(pat=>pat.id===selectedPatientId);
            if(!p) return getLoginHTML();

            const completed    = p.milestones.filter(m=>m.completed).length;
            const total        = p.milestones.length;
            const milestonePct = Math.round(completed/total*100);
            const dayPct       = Math.min(100, Math.round(p.currentDay/p.totalDays*100));
            const waGeneral    = `https://wa.me/56958049193?text=${encodeURIComponent(`Hola Clínica Hunza, soy ${p.name}. Tengo una consulta sobre mi postoperatorio de ${p.procedure}.`)}`;

            const macroStages = ['Evaluación','Procedimiento','Recuperación','Resultados'];
            const macroActive = 2; // todos los pacientes están en Recuperación

            let appointmentHTML = '';
            if(p.pendingAppointment) {
                const waAppt = `https://wa.me/56958049193?text=${encodeURIComponent(`Hola Clínica Hunza, soy ${p.name}. Me gustaría agendar: ${p.pendingAppointment}.`)}`;
                const urgent = p.priority==='red';
                appointmentHTML = `
                <div id="section-cita" class="rounded-3xl p-5 relative overflow-hidden"
                     style="background:${urgent?'#fff5f5':'#eff8f3'};border:1px solid ${urgent?'#fecaca':'#c5d8cf'};">
                    <div class="absolute -right-4 -top-4 opacity-[.06]">
                        <i data-lucide="calendar-clock" style="width:100px;height:100px;color:${urgent?'#dc2626':'#2a4a3c'};"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider mb-2"
                             style="color:${urgent?'#dc2626':'#2a4a3c'};">
                            <i data-lucide="${urgent?'alert-triangle':'bell-ring'}" style="width:14px;height:14px;"></i>
                            ${urgent?'Cita Urgente':'Cita Pendiente'}
                        </div>
                        <h3 class="font-serif text-lg mb-4" style="color:#1a2820;">${p.pendingAppointment}</h3>
                        <a href="${waAppt}" target="_blank"
                           class="btn-shine inline-flex items-center gap-2 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-md transition-all hover:opacity-90"
                           style="background:${urgent?'#dc2626':'#2a4a3c'};">
                            Agendar por WhatsApp
                            <i data-lucide="arrow-right" style="width:15px;height:15px;"></i>
                        </a>
                    </div>
                </div>`;
            }

            return `
            <div class="min-h-screen flex flex-col pb-nav view-enter" style="background:#f4efe6;">

                <!-- Header -->
                <header class="sticky top-0 z-20 backdrop-blur-md"
                        style="background:rgba(244,239,230,.9);border-bottom:1px solid #ddd6c9;">
                    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="leaf" style="width:16px;height:16px;color:#2a4a3c;"></i>
                            <span class="font-serif font-semibold text-base" style="color:#2a4a3c;">Hunza Care</span>
                        </div>
                        <button onclick="setView('login')"
                            class="rounded-xl p-2 transition-all"
                            style="color:#9aada5;" onmouseover="this.style.background='#e5eeea'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="x" style="width:18px;height:18px;"></i>
                        </button>
                    </div>
                </header>

                <main class="max-w-md mx-auto w-full flex-1 px-4 py-5 flex flex-col gap-5">

                    <!-- Greeting + Hero -->
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <p class="text-xs font-medium mb-0.5" style="color:#9aada5;">Bienvenida de vuelta</p>
                                <h1 class="font-serif text-2xl leading-tight" style="color:#1a2820;">Hola, ${p.name.split(' ')[0]} 👋</h1>
                            </div>
                            <div class="avatar w-12 h-12 text-base text-white shadow-md"
                                 style="background:#2a4a3c;">${getInitials(p.name)}</div>
                        </div>

                        <!-- Hero card -->
                        <div class="rounded-[1.75rem] p-6 relative overflow-hidden shadow-lg"
                             style="background:linear-gradient(135deg,#2a4a3c 0%,#1e3a2e 100%);">
                            <div class="absolute inset-0 opacity-[.04]">
                                <i data-lucide="activity" style="width:220px;height:220px;position:absolute;right:-40px;bottom:-40px;color:white;"></i>
                            </div>
                            <div class="relative z-10 flex items-start justify-between gap-4">
                                <div class="flex-1 min-w-0">
                                    <p class="text-[10px] uppercase tracking-widest font-semibold mb-1" style="color:rgba(255,255,255,.5);">Tu tratamiento</p>
                                    <h2 class="font-serif text-lg text-white leading-snug mb-3">${p.procedure}</h2>
                                    <div class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-medium"
                                         style="background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);">
                                        <div class="w-1.5 h-1.5 rounded-full bg-emerald-400" style="animation:pulse 2s infinite;"></div>
                                        ${p.stage}
                                    </div>
                                    <div class="mt-4">
                                        <div class="flex justify-between mb-1.5">
                                            <span class="text-[11px]" style="color:rgba(255,255,255,.5);">Día ${p.currentDay} de ${p.totalDays}</span>
                                            <span class="text-[11px] font-semibold text-white">${dayPct}%</span>
                                        </div>
                                        <div class="h-1.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,.15);">
                                            <div class="h-full rounded-full progress-fill" style="width:${dayPct}%;background:linear-gradient(90deg,#c49a54,#e0b96e);"></div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Circular progress -->
                                <div class="shrink-0 flex flex-col items-center gap-1">
                                    ${svgCircleProgress(milestonePct,76,5)}
                                    <p class="text-[10px]" style="color:rgba(255,255,255,.45);">${completed}/${total} etapas</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${appointmentHTML}

                    <!-- Acceso rápido -->

                            <button onclick="document.getElementById('section-timeline').scrollIntoView({behavior:'smooth'})" class="quick-card">
                                <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#e5eeea;">
                                    <i data-lucide="trending-up" style="width:17px;height:17px;color:#2a4a3c;"></i>
                                </div>
                                <span class="text-[11px] font-medium" style="color:#3d5247;">Mi Plan</span>
                            </button>
                        </div>
                    </div>

                    <!-- Etapas del tratamiento (macro stages) -->
                    <div class="bg-white rounded-2xl p-5" style="border:1px solid #ddd6c9;">
                        <p class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#9aada5;">Etapas del tratamiento</p>
                        <div class="flex items-center gap-0">
                            ${macroStages.map((s,i)=>{
                                const done = i < macroActive;
                                const current = i === macroActive;
                                const next = i > macroActive;
                                return `
                                <div class="flex items-center flex-1 ${i===macroStages.length-1?'flex-none':''}">
                                    <div class="flex flex-col items-center gap-1.5">
                                        <div class="stage-dot" style="background:${done?'#2a4a3c':current?'#c49a54':'#e5dfd5'};border:${next?'2px solid #ddd6c9':'none'};">
                                            ${done?`<i data-lucide="check" style="width:13px;height:13px;color:white;"></i>`:
                                                   current?`<div style="width:8px;height:8px;background:white;border-radius:50%;"></div>`:
                                                   `<div style="width:8px;height:8px;background:#c8bfb4;border-radius:50%;"></div>`}
                                        </div>
                                        <span class="text-[10px] font-semibold text-center leading-tight whitespace-nowrap"
                                              style="color:${done?'#2a4a3c':current?'#c49a54':'#b0a898'};">${s}
                                            ${done?'<br><span style="font-size:9px;color:#9aada5;">✓</span>':''}
                                            ${current?'<br><span style="font-size:9px;color:#c49a54;">Actual</span>':''}
                                            ${next&&i===macroActive+1?'<br><span style="font-size:9px;color:#9aada5;">Próximo</span>':''}
                                        </span>
                                    </div>
                                    ${i<macroStages.length-1?`<div class="h-px flex-1 mx-1" style="background:${done?'#2a4a3c':'#ddd6c9'};"></div>`:''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Línea de tiempo detallada -->
                    <div id="section-timeline">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-serif text-lg flex items-center gap-2" style="color:#1a2820;">
                                <i data-lucide="calendar-check" style="width:18px;height:18px;color:#c49a54;"></i>
                                Línea de Tiempo

                            ${p.milestones.map((m,idx)=>{
                                const isCurrent = !m.completed && (idx===0 || p.milestones[idx-1].completed);
                                return `
                                <div class="snap-center shrink-0 w-52 p-4 rounded-2xl relative transition-all"
                                     style="background:${m.completed?'#2a4a3c':isCurrent?'white':'white'};
                                            border:${m.completed?'none':isCurrent?'2px solid #c49a54':'1px solid #ddd6c9'};
                                            opacity:${!m.completed&&!isCurrent?.7:1};
                                            box-shadow:${isCurrent?'0 0 0 0 transparent,0 4px 20px rgba(196,154,84,.2)':''};">
                                    ${m.completed?`<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center shadow-sm" style="background:#c49a54;">
                                        <i data-lucide="check" style="width:11px;height:11px;color:white;"></i></div>`:''}
                                    ${isCurrent?`<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center shadow-sm" style="background:#c49a54;">
                                        <i data-lucide="zap" style="width:11px;height:11px;color:white;"></i></div>`:''}
                                    <span class="text-[10px] font-bold uppercase tracking-wider block mb-1.5"
                                          style="color:${m.completed?'rgba(255,255,255,.5)':isCurrent?'#c49a54':'#b0a898'};">${m.day}</span>
                                    <h4 class="font-serif text-base font-semibold mb-1.5 leading-tight"
                                        style="color:${m.completed?'white':'#1a2820'};">${m.title}</h4>
                                    <p class="text-xs leading-relaxed" style="color:${m.completed?'rgba(255,255,255,.6)':'#6c7e75'};">${m.desc}</p>
                                    ${idx<p.milestones.length-1?`<div class="absolute top-1/2 -right-3 w-3 h-px" style="background:${m.completed?'#2a4a3c':'#ddd6c9'};"></div>`:''}
                                </div>`;
                            }).join('')}
                        </div>
                        <p class="text-[10px] text-center mt-1 flex items-center justify-center gap-1" style="color:#b0a898;">
                            <i data-lucide="arrow-left-right" style="width:11px;height:11px;"></i> Desliza para ver más
                        </p>

                    <!-- Semáforo clínico (perspectiva paciente) -->

                        <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:#9aada5;">Estado Clínico Actual</p>
                        <div class="grid grid-cols-3 gap-2">
                            ${[
                                {key:'green', emoji:'😊', label:'Todo bien',  sub:'Continúa tu recuperación según lo indicado.',icon:'check-circle-2'},
                                {key:'yellow',emoji:'😐', label:'Atención',   sub:'Algunos síntomas requieren seguimiento.',icon:'alert-circle'},
                                {key:'red',   emoji:'⚠️', label:'Alerta',     sub:'Contáctanos para evaluación profesional.',icon:'phone-call'},
                            ].map(s=>{
                                const active = p.priority===s.key;
                                return `
                                <div class="rounded-2xl p-4 text-center transition-all"
                                     style="background:${active?(s.key==='green'?'#2a4a3c':s.key==='yellow'?'#f59e0b':'#ef4444'):'white'};
                                            border:1px solid ${active?'transparent':(s.key==='green'?'#c5d8cf':s.key==='yellow'?'#fde68a':'#fecaca')};
                                            opacity:${active?1:.55};">
                                    <div class="text-xl mb-1">${s.emoji}</div>
                                    <p class="font-semibold text-[11px] leading-tight mb-1"

                                    <p class="text-[10px] leading-tight" style="color:${active?'rgba(255,255,255,.7)':'#9aada5'};">${s.sub}</p>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- FAQ -->
                    <div id="section-dudas">
                        <h3 class="font-serif text-lg mb-3 flex items-center gap-2" style="color:#1a2820;">
                            <i data-lucide="help-circle" style="width:18px;height:18px;color:#c49a54;"></i> Cuidados y Dudas
                        </h3>
                        <div class="flex flex-col gap-2">
                            ${p.faqs.map(faq=>`
                            <div class="bg-white rounded-2xl overflow-hidden" style="border:1px solid #ddd6c9;">
                                <button onclick="toggleFAQ(this)"
                                    class="w-full px-5 py-4 text-left flex justify-between items-center transition-all"
