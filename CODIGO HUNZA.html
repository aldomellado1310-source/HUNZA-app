            color: var(--text);

        ::-webkit-scrollbar-thumb { background: #c8c0b4; border-radius: 10px; }

        select {

        .faq-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease; }
        .faq-body.open { grid-template-rows:1fr; }

        /* Doctor card expansion */
        .card-expand { display:grid; grid-template-rows:0fr; transition:grid-template-rows .28s ease; }
        .card-expand.open { grid-template-rows:1fr; }
        .card-expand > div { overflow:hidden; }

        .badge-red    { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
        .badge-yellow { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
        .badge-green  { background:#ecfdf5; color:#15803d; border:1px solid #a7f3d0; }

            0%,100% { box-shadow:0 0 0 0 rgba(220,38,38,.16); }
            50%      { box-shadow:0 0 0 6px rgba(220,38,38,0); }

        .card-urgent { animation:ring-pulse 2.4s ease-in-out infinite; }

        .sidebar-item:hover { background:rgba(255,255,255,.1); }
        .sidebar-item.active { background:rgba(255,255,255,.18); }

        .avatar { display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:600; letter-spacing:.02em; flex-shrink:0; }

        .btn-shine { position:relative; overflow:hidden; }
        .btn-shine::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 60%); pointer-events:none; }

        .quick-card { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px; background:var(--surface); border:1px solid var(--border); border-radius:18px; cursor:pointer; transition:all .18s; }
        .quick-card:hover { border-color:var(--border-green); background:var(--primary-light); }
        .quick-card:active { transform:scale(.96); }

        /* Photo upload slot */
        .photo-slot { aspect-ratio:1; border-radius:16px; overflow:hidden; position:relative; }
        .photo-upload-label { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; }

        /* Textarea */
        textarea { resize:none; outline:none; font-family:'Montserrat',sans-serif; }

        .ind-btn { padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; transition:all .18s; cursor:pointer; border:1px solid; }
    </style>
</head>

// ============================================================
// PERSISTENCIA LOCALSTORAGE
// ============================================================
function savePatientData() {
    const data = {};
    patientsData.forEach(p => {
        data[p.id] = {
            priority:   p.priority,
            indicators: p.indicators,
            teamNotes:  p.teamNotes,
            photos:     p.photos,
        };
    });
    try { localStorage.setItem('hunza_data', JSON.stringify(data)); } catch(e) {}
}

function loadPatientData() {
    try {
        const raw = localStorage.getItem('hunza_data');
        if(!raw) return;
        const data = JSON.parse(raw);
        patientsData.forEach(p => {
            if(data[p.id]) {
                if(data[p.id].priority)   p.priority   = data[p.id].priority;
                if(data[p.id].indicators) p.indicators = data[p.id].indicators;
                if(data[p.id].teamNotes)  p.teamNotes  = data[p.id].teamNotes;
                if(data[p.id].photos)     p.photos     = data[p.id].photos;
            }
        });
    } catch(e) {}
}

// ============================================================
// UTILIDADES
// ============================================================
function getInitials(n) { return n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }
function priorityLabel(p) { return {red:'Urgente',yellow:'Seguimiento',green:'Estable'}[p]; }

function svgCircleProgress(pct, size=72, sw=5) {
    const r=(size-sw)/2, c=2*Math.PI*r;
    const dash=(pct/100*c).toFixed(2), gap=(c-pct/100*c).toFixed(2);
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="${sw}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#c49a54" stroke-width="${sw}"
            stroke-dasharray="${dash} ${gap}" stroke-linecap="round"
            transform="rotate(-90 ${size/2} ${size/2})"/>
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
            fill="white" font-size="13" font-weight="700" font-family="Montserrat,sans-serif">${pct}%</text>
    </svg>`;
}

// ---- INDICADORES ----

    const p=patientsData.find(p=>p.id===patientId);

// ---- NOTAS ----
function addNote(patientId) {
    const el=document.getElementById(`note-input-${patientId}`);
    if(!el||!el.value.trim()) return;
    const p=patientsData.find(p=>p.id===patientId);
    if(p){
        p.teamNotes.unshift({ text:el.value.trim(), date:new Date().toLocaleDateString('es-CL'), author:'Dra. Macarena Gutiérrez' });
        savePatientData(); render(); setTimeout(initChart,50);
    }
}

function deleteNote(patientId, idx) {
    const p=patientsData.find(p=>p.id===patientId);
    if(p){ p.teamNotes.splice(idx,1); savePatientData(); render(); if(view==='doctor') setTimeout(initChart,50); }
}

// ---- FOTOS ----
function resizeImage(file, cb) {
    const reader=new FileReader();
    reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
            const max=900; let w=img.width, h=img.height;
            if(w>max){h=h*max/w;w=max;} if(h>max){w=w*max/h;h=max;}
            const cv=document.createElement('canvas');
            cv.width=w; cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h);
            cb(cv.toDataURL('image/jpeg',.72));
        };
        img.src=e.target.result;
    };
    reader.readAsDataURL(file);
}

function handlePhotoUpload(patientId, photoIndex, input) {
    const file=input.files[0]; if(!file) return;
    resizeImage(file, dataUrl=>{
        const p=patientsData.find(p=>p.id===patientId);
        if(p){
            p.photos[photoIndex].src=dataUrl;
            p.photos[photoIndex].date=new Date().toLocaleDateString('es-CL');
            savePatientData();
            // Actualizar DOM directamente para no perder scroll
            const slot=document.getElementById(`photo-slot-${patientId}-${photoIndex}`);
            if(slot){ slot.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`; }
            const dateEl=document.getElementById(`photo-date-${patientId}-${photoIndex}`);
            if(dateEl){ dateEl.textContent=p.photos[photoIndex].date; }
        }
    });
}

function deletePhoto(patientId, photoIndex) {
    const p=patientsData.find(p=>p.id===patientId);
    if(p){ p.photos[photoIndex].src=null; p.photos[photoIndex].date=null; savePatientData(); render(); }
}

// ---- FILTROS GRÁFICO ----
function handleFilterChange() {
    chartFilters.period=document.getElementById('periodFilter').value;
    chartFilters.month=document.getElementById('monthFilter').value;
    const ms=document.getElementById('monthFilter');
    if(chartFilters.period==='anual'){ ms.disabled=true; ms.classList.add('opacity-40','cursor-not-allowed'); }
    else{ ms.disabled=false; ms.classList.remove('opacity-40','cursor-not-allowed'); }
    initChart();
}

// ============================================================
// GRÁFICO
// ============================================================
function initChart() {
    const ctx=document.getElementById('proceduresChart'); if(!ctx) return;
    if(chartInstance) chartInstance.destroy();
    let labels=[],data=[],chartTitle='';
    const mf=parseInt(chartFilters.month)/10+0.5;
    if(chartFilters.period==='anual'){
        labels=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        data=[120,140,115,160,185,170,200,220,190,210,250,280];
        chartTitle='Total Procedimientos Anuales';
    } else if(chartFilters.period==='mensual'){
        labels=['Lipo Láser','Drawn Face','Armonización','Toxina B.','Lipomarcación'];
        data=[45,25,30,50,15].map(v=>Math.round(v*mf));
        chartTitle=`Procedimientos — ${mesesNombres[parseInt(chartFilters.month)-1]}`;
    } else {
        labels=['Lun','Mar','Mié','Jue','Vie','Sáb'];
        data=[8,5,12,10,16,7].map(v=>Math.round(v*mf));
        chartTitle=`Flujo Diario — ${mesesNombres[parseInt(chartFilters.month)-1]}`;
    }
    chartInstance=new Chart(ctx,{
        type:'bar',
        data:{ labels, datasets:[{ label:chartTitle, data, backgroundColor:'#2a4a3c', borderRadius:8, barThickness:chartFilters.period==='anual'?12:22 }] },
        options:{
            responsive:true, maintainAspectRatio:false,
            animation:{duration:450,easing:'easeOutQuart'},
            plugins:{
                legend:{display:false},
                tooltip:{ backgroundColor:'#1e3a2e', padding:10, cornerRadius:10, callbacks:{ label:c=>` ${c.parsed.y} procedimientos` } }
            },
            scales:{
                y:{ beginAtZero:true, grid:{borderDash:[4,4],color:'#ede8df'}, border:{display:false}, ticks:{color:'#9aada5',font:{size:10}} },
                x:{ grid:{display:false}, border:{display:false}, ticks:{color:'#9aada5',font:{size:10}} }
            }
        }
    });
}

    else if(view==='doctor')  app.innerHTML=getDoctorHTML();
    else if(view==='patient') app.innerHTML=getPatientHTML();
    lucide.createIcons();
}

            </div>

            <!-- Notas del equipo -->
            ${p.teamNotes.length>0?`
            <div id="section-notas">
                <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:#9aada5;">Notas del Equipo</p>
                <div class="flex flex-col gap-3">
                    ${p.teamNotes.map(n=>`
                    <div class="bg-white rounded-2xl p-4" style="border:1px solid #ddd6c9;">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="avatar w-9 h-9 text-xs text-white" style="background:#2a4a3c;">MG</div>
                            <div>
                                <p class="font-semibold text-xs" style="color:#1a2820;">${n.author}</p>
                                <p class="text-[11px]" style="color:#9aada5;">${n.date}</p>
                            </div>
                        </div>
                        <p class="text-sm leading-relaxed" style="color:#3d5247;">${n.text}</p>
                    </div>`).join('')}
                </div>
            </div>`:``}

            ${appointmentHTML}

            <!-- Acceso rápido -->
            <div>
                <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:#9aada5;">Acceso rápido</p>
                <div class="grid grid-cols-4 gap-2">
                    <a href="${waGeneral}" target="_blank" class="quick-card">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#e5eeea;">
                            <i data-lucide="message-circle" style="width:17px;height:17px;color:#2a4a3c;"></i>
                        </div>
                        <span class="text-[11px] font-medium text-center leading-tight" style="color:#3d5247;">Mensajes</span>
                    </a>
                    <button onclick="document.getElementById('section-cita')?.scrollIntoView({behavior:'smooth'})" class="quick-card">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#f5e8d0;">
                            <i data-lucide="calendar" style="width:17px;height:17px;color:#c49a54;"></i>
                        </div>
                        <span class="text-[11px] font-medium" style="color:#3d5247;">Citas</span>
                    </button>
                    <button onclick="document.getElementById('section-fotos').scrollIntoView({behavior:'smooth'})" class="quick-card">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#e5eeea;">
                            <i data-lucide="camera" style="width:17px;height:17px;color:#2a4a3c;"></i>
                        </div>
                        <span class="text-[11px] font-medium" style="color:#3d5247;">Fotos</span>
                    </button>
                    <button onclick="document.getElementById('section-timeline').scrollIntoView({behavior:'smooth'})" class="quick-card">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center" style="background:#e5eeea;">
                            <i data-lucide="trending-up" style="width:17px;height:17px;color:#2a4a3c;"></i>
                        </div>
                        <span class="text-[11px] font-medium" style="color:#3d5247;">Mi Plan</span>
                    </button>
                </div>
            </div>

            <!-- Macro etapas -->
            <div class="bg-white rounded-2xl p-5" style="border:1px solid #ddd6c9;">
                <p class="text-xs font-semibold uppercase tracking-widest mb-4" style="color:#9aada5;">Etapas del tratamiento</p>
                <div class="flex items-start gap-0">
                    ${macroStages.map((s,i)=>{
                        const done=i<macroActive, current=i===macroActive, next=i>macroActive;
                        return `
                        <div class="flex items-center flex-1 ${i===macroStages.length-1?'flex-none':''}">
                            <div class="flex flex-col items-center gap-1.5">
                                <div style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${done?'#2a4a3c':current?'#c49a54':'#e5dfd5'};border:${next?'2px solid #ddd6c9':'none'};">
                                    ${done?`<i data-lucide="check" style="width:13px;height:13px;color:white;"></i>`:
                                           current?`<div style="width:8px;height:8px;background:white;border-radius:50%;"></div>`:
                                           `<div style="width:8px;height:8px;background:#c8bfb4;border-radius:50%;"></div>`}
                                </div>
                                <span class="text-[10px] font-semibold text-center leading-tight"
                                      style="color:${done?'#2a4a3c':current?'#c49a54':'#b0a898'};">${s}
                                    ${done?'<br><span style="color:#9aada5;font-size:9px;">✓</span>':''}
                                    ${current?'<br><span style="color:#c49a54;font-size:9px;">Actual</span>':''}
                                    ${i===macroActive+1?'<br><span style="color:#9aada5;font-size:9px;">Próximo</span>':''}
                                </span>
                            </div>
                            ${i<macroStages.length-1?`<div class="h-px flex-1 mx-1" style="background:${done?'#2a4a3c':'#ddd6c9'};margin-bottom:22px;"></div>`:''}
                        </div>`;
                    }).join('')}
                </div>
            </div>

            <!-- Línea de tiempo -->
            <div id="section-timeline">
                <h3 class="font-serif text-lg mb-3 flex items-center gap-2" style="color:#1a2820;">
                    <i data-lucide="calendar-check" style="width:18px;height:18px;color:#c49a54;"></i>
                    Línea de Tiempo
                </h3>
                <div class="flex overflow-x-auto gap-3 pb-3 px-0.5 no-scrollbar snap-x cursor-grab active:cursor-grabbing">
                    ${p.milestones.map((m,idx)=>{
                        const isCurrent=!m.completed&&(idx===0||p.milestones[idx-1].completed);
                        return `
                        <div class="snap-center shrink-0 w-52 p-4 rounded-2xl relative transition-all"
                             style="background:${m.completed?'#2a4a3c':'white'};
                                    border:${m.completed?'none':isCurrent?'2px solid #c49a54':'1px solid #ddd6c9'};
                                    opacity:${!m.completed&&!isCurrent?.65:1};
                                    box-shadow:${isCurrent?'0 4px 20px rgba(196,154,84,.2)':''};">
                            ${m.completed?`<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center shadow-sm" style="background:#c49a54;"><i data-lucide="check" style="width:11px;height:11px;color:white;"></i></div>`:''}
                            ${isCurrent?`<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center shadow-sm" style="background:#c49a54;"><i data-lucide="zap" style="width:11px;height:11px;color:white;"></i></div>`:''}
                            <span class="text-[10px] font-bold uppercase tracking-wider block mb-1.5"
                                  style="color:${m.completed?'rgba(255,255,255,.5)':isCurrent?'#c49a54':'#b0a898'};">${m.day}</span>
                            <h4 class="font-serif text-base font-semibold mb-1.5 leading-tight"
                                style="color:${m.completed?'white':'#1a2820'};">${m.title}</h4>
                            <p class="text-xs leading-relaxed" style="color:${m.completed?'rgba(255,255,255,.55)':'#6c7e75'};">${m.desc}</p>
                            ${idx<p.milestones.length-1?`<div class="absolute top-1/2 -right-3 w-3 h-px" style="background:${m.completed?'#2a4a3c':'#ddd6c9'};"></div>`:''}
                        </div>`;
                    }).join('')}
                </div>
                <p class="text-[10px] text-center mt-1 flex items-center justify-center gap-1" style="color:#b0a898;">
                    <i data-lucide="arrow-left-right" style="width:11px;height:11px;"></i> Desliza para ver más
                </p>
            </div>

            <!-- Semáforo clínico -->
            <div>
                <p class="text-xs font-semibold uppercase tracking-widest mb-3" style="color:#9aada5;">Estado Clínico Actual</p>
                <div class="grid grid-cols-3 gap-2">
                    ${[
                        {key:'green', emoji:'😊', label:'Todo bien',  sub:'Continúa tu recuperación según lo indicado.'},
                        {key:'yellow',emoji:'😐', label:'Atención',   sub:'Algunos síntomas requieren seguimiento.'},
                        {key:'red',   emoji:'⚠️', label:'Alerta',     sub:'Contáctanos para evaluación profesional.'},
                    ].map(s=>{
                        const active=p.priority===s.key;
                        const bgActive=s.key==='green'?'#2a4a3c':s.key==='yellow'?'#f59e0b':'#ef4444';
                        return `
                        <div class="rounded-2xl p-4 text-center transition-all"
                             style="background:${active?bgActive:'white'};
                                    border:1px solid ${active?'transparent':(s.key==='green'?'#c5d8cf':s.key==='yellow'?'#fde68a':'#fecaca')};
                                    opacity:${active?1:.5};">
                            <div class="text-xl mb-1">${s.emoji}</div>
                            <p class="font-semibold text-[11px] leading-tight mb-1" style="color:${active?'white':(s.key==='green'?'#2a4a3c':s.key==='yellow'?'#b45309':'#dc2626')};">${s.label}</p>
                            <p class="text-[10px] leading-tight" style="color:${active?'rgba(255,255,255,.65)':'#9aada5'};">${s.sub}</p>
                        </div>`;
                    }).join('')}
                </div>
            </div>

            <!-- Registro Fotográfico -->
            <div id="section-fotos">
                <h3 class="font-serif text-lg mb-3 flex items-center gap-2" style="color:#1a2820;">
                    <i data-lucide="camera" style="width:18px;height:18px;color:#c49a54;"></i>
                    Evolución Fotográfica
                </h3>
                <p class="text-xs mb-4" style="color:#9aada5;">Sube fotos para registrar tu progreso. Solo las verá tu equipo médico.</p>
                <div class="grid grid-cols-3 gap-3">
                    ${p.photos.map((photo,idx)=>`
                    <div>
                        <div id="photo-slot-${p.id}-${idx}" class="photo-slot"
                             style="background:${photo.src?'transparent':'#e8e2d8'};border:${photo.src?'none':'2px dashed #c8bfb4'};">
                            ${photo.src
                                ?`<img src="${photo.src}" style="width:100%;height:100%;object-fit:cover;">
                                  <button onclick="deletePhoto(${p.id},${idx})"
                                    style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;">
                                    <i data-lucide="x" style="width:11px;height:11px;"></i>
                                  </button>`
                                :`<label class="photo-upload-label">
                                    <i data-lucide="camera" style="width:22px;height:22px;color:#9aada5;"></i>
                                    <span style="font-size:11px;color:#9aada5;font-weight:500;">Subir</span>
                                    <input type="file" accept="image/*" style="display:none;"
                                        onchange="handlePhotoUpload(${p.id},${idx},this)">
                                  </label>`}
                        </div>
                        <p class="text-[11px] font-semibold text-center mt-1.5" style="color:#3d5247;">${photo.label}</p>
                        <p id="photo-date-${p.id}-${idx}" class="text-[10px] text-center" style="color:#9aada5;">${photo.date||''}</p>
                    </div>`).join('')}
                </div>
            </div>

            <!-- FAQ -->
            <div id="section-dudas">
                <h3 class="font-serif text-lg mb-3 flex items-center gap-2" style="color:#1a2820;">
                    <i data-lucide="help-circle" style="width:18px;height:18px;color:#c49a54;"></i>
                    Cuidados y Dudas
                </h3>
                <div class="flex flex-col gap-2">
                    ${p.faqs.map(faq=>`
                    <div class="bg-white rounded-2xl overflow-hidden" style="border:1px solid #ddd6c9;">
                        <button onclick="toggleFAQ(this)" class="w-full px-5 py-4 text-left flex justify-between items-center transition-all"
                                style="background:white;" onmouseover="this.style.background='#f4efe6'" onmouseout="this.style.background='white'">
                            <span class="font-medium text-sm pr-4 leading-snug" style="color:#1a2820;">${faq.q}</span>
                            <i data-lucide="chevron-down" style="width:16px;height:16px;color:#9aada5;transition:transform .3s;flex-shrink:0;"></i>
                        </button>
                        <div class="faq-body">
                            <div class="px-5 pb-4 pt-3 text-sm leading-relaxed" style="border-top:1px solid #ede8df;background:#faf7f2;color:#6c7e75;">
                                ${faq.a}
                            </div>
                        </div>
                    </div>`).join('')}
                </div>
            </div>

            <!-- Quote -->
            <div class="rounded-3xl p-6 relative overflow-hidden"
                 style="background:linear-gradient(135deg,#2a4a3c,#1e3a2e);">
                <div class="absolute -right-4 -bottom-4 opacity-[.04]">
                    <i data-lucide="leaf" style="width:120px;height:120px;color:white;"></i>
                </div>
                <div class="relative z-10 text-center">
                    <i data-lucide="quote" style="width:22px;height:22px;color:#c49a54;margin:0 auto 10px;display:block;opacity:.6;"></i>
                    <p class="font-serif italic text-sm leading-relaxed" style="color:rgba(255,255,255,.85);">"${p.quote}"</p>
                    <p class="text-[10px] mt-3 font-medium uppercase tracking-widest" style="color:rgba(255,255,255,.25);">Clínica Hunza</p>
                </div>
            </div>

            <!-- WhatsApp -->
            <a href="${waGeneral}" target="_blank"
               class="w-full rounded-2xl flex items-center justify-center gap-3 p-4 font-semibold transition-all active:scale-[.98]"
               style="background:white;border:2px solid #25D366;color:#25D366;"
               onmouseover="this.style.background='#f0fdf4'" onmouseout="this.style.background='white'">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#25D366;flex-shrink:0;"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Tengo una duda general
            </a>
        </main>

        <!-- Bottom nav -->
        <nav class="fixed bottom-0 left-0 right-0 z-30 flex items-center justify-around px-2"
             style="background:rgba(255,255,255,.95);border-top:1px solid #ddd6c9;backdrop-filter:blur(12px);padding-top:10px;padding-bottom:max(14px,env(safe-area-inset-bottom,14px));">
            <button onclick="window.scrollTo({top:0,behavior:'smooth'})"
                    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl"
                    style="color:#2a4a3c;">
                <i data-lucide="home" style="width:20px;height:20px;"></i>
                <span style="font-size:10px;font-weight:600;">Inicio</span>
            </button>
            <button onclick="document.getElementById('section-timeline').scrollIntoView({behavior:'smooth'})"
                    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl"
                    style="color:#9aada5;">
                <i data-lucide="clipboard-list" style="width:20px;height:20px;"></i>
                <span style="font-size:10px;font-weight:500;">Mi Plan</span>
            </button>
            <button class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg -mt-4"
                    style="background:#2a4a3c;">
                <span class="font-serif font-bold text-lg text-white">H</span>
            </button>
            <button onclick="document.getElementById('section-fotos').scrollIntoView({behavior:'smooth'})"
                    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl"
                    style="color:#9aada5;">
                <i data-lucide="camera" style="width:20px;height:20px;"></i>
                <span style="font-size:10px;font-weight:500;">Fotos</span>
            </button>
            <a href="${waGeneral}" target="_blank"
               class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl"
               style="color:#9aada5;">
                <i data-lucide="message-circle" style="width:20px;height:20px;"></i>
                <span style="font-size:10px;font-weight:500;">Mensajes</span>
            </a>
        </nav>
    </div>`;
}

// ============================================================
// INIT
// ============================================================
loadPatientData();
render();
</script>
</body>
</html>
