<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunza Care - Seguimiento de Pacientes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js para Análisis de Datos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #faf9f6;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 10px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Select styling for filters */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
            padding-right: 2rem !important;
        }
    </style>
</head>
<body class="antialiased min-h-screen">
    
    <div id="app"></div>

    <script>
        // --- ESTADO Y DATOS DE LA APLICACIÓN ---
        let view = 'login'; 
        let selectedPatientId = null;
        let chartInstance = null; 

        // Estado de los filtros del gráfico
        let chartFilters = {
            period: 'mensual',
            month: '5' // Mayo por defecto
        };

        const mesesNombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        let patientsData = [
            { 
                id: 1, 
                name: 'Valentina Soto', 
                procedure: 'Liposucción Láser Ambulatoria', 
                stage: 'Semana 2 - Kinesiología Postoperatoria', 
                priority: 'yellow', 
                nextControl: '28/05/2026', 
                pendingAppointment: 'Sesión de Drenaje Linfático (Semana 2)',
                currentMilestone: 2, 
                milestones: [
                    { day: 'Día 1', title: 'Procedimiento', desc: 'Cirugía ambulatoria. Reposo y cuidados iniciales.', completed: true },
                    { day: 'Día 7', title: 'Uso de Faja', desc: 'Uso estricto de faja y postura por 10 a 14 días.', completed: true },
                    { day: 'Semana 2', title: 'Drenaje Linfático', desc: 'Inicio de 8 a 12 sesiones de kinesiología.', completed: false },
                    { day: 'Mes 1', title: 'Reducción 40%', desc: 'Desinflamación visible del 40-50%.', completed: false },
                    { day: 'Mes 3', title: 'Resultado 80%', desc: 'Resultado avanzado y moldeado evidente.', completed: false },
                    { day: 'Mes 6', title: 'Alta Definitiva', desc: 'Resultado final y definitivo.', completed: false },
                ],
                faqs: [
                    { q: '¿Debo usar faja de compresión?', a: 'Sí, es obligatorio. Se recomienda cuidados exhaustivos desde el punto de vista de uso de faja y postura de 10 a 14 días para asegurar la mejor recuperación.' },
                    { q: '¿Cuántas sesiones de drenaje linfático necesito?', a: 'Se recomiendan entre 8 y 12 sesiones distribuidas en las primeras semanas para eliminar líquidos y reducir el edema.' },
                    { q: '¿Cuándo puedo retomar mis actividades?', a: 'La mayoría de los pacientes pueden retomar sus actividades diarias ligeras en una semana.' }
                ],
                quote: "La paciencia y la disciplina en tus cuidados son las claves de resultados extraordinarios." 
            },
            { 
                id: 2, 
                name: 'Camila Ríos', 
                procedure: 'DRAWNFACE (Marcación Mandibular)', 
                stage: 'Día 5 - Asentamiento', 
                priority: 'green', 
                nextControl: '22/05/2026', 
                pendingAppointment: null, // No tiene citas pendientes urgentes
                currentMilestone: 1,
                milestones: [
                    { day: 'Día 1', title: 'Procedimiento', desc: 'Definición del ángulo mandibular.', completed: true },
                    { day: 'Día 3-7', title: 'Desinflamación', desc: 'Disminución del edema inicial.', completed: false },
                    { day: 'Mes 1', title: 'Efecto Tensor', desc: 'Producción de colágeno y efecto tensor visible.', completed: false },
                    { day: 'Mes 3', title: 'Resultado Final', desc: 'Perfil completamente definido y armónico.', completed: false }
                ],
                faqs: [
                    { q: '¿Es normal sentir tensión en el cuello?', a: 'Sí, es completamente normal sentir una leve tensión durante los primeros días mientras el tejido se adapta a la estimulación láser.' },
                    { q: '¿Cuándo veré el resultado definitivo?', a: 'El resultado definitivo del perfilamiento se aprecia hacia el tercer mes por la producción de colágeno.' }
                ],
                quote: "Descubre cómo un perfil definido puede potenciar tu confianza." 
            },
            { 
                id: 3, 
                name: 'Sofía Araneda', 
                procedure: 'Armonización Facial Completa', 
                stage: 'Día 1 - Inflamación Inicial', 
                priority: 'red', 
                nextControl: '18/05/2026', 
                pendingAppointment: 'Control Primeras 48 Hrs',
                currentMilestone: 0,
                milestones: [
                    { day: 'Día 1', title: 'Aplicación', desc: 'Relleno de ojeras o pómulos. Inflamación.', completed: true },
                    { day: 'Día 3', title: 'Baja Edema', desc: 'Reducción de hinchazón o posibles hematomas.', completed: false },
                    { day: 'Semana 2', title: 'Asentamiento', desc: 'El ácido hialurónico se integra al tejido.', completed: false },
                    { day: 'Mes 12', title: 'Re-evaluación', desc: 'El producto comienza a reabsorberse.', completed: false }
                ],
                faqs: [
                    { q: '¿Puedo hacer ejercicio hoy?', a: 'Se recomienda evitar el ejercicio intenso, saunas y exposición solar directa durante las primeras 48 horas.' },
                    { q: 'Apareció un pequeño moretón, ¿es normal?', a: 'Sí, al ser un procedimiento inyectable pueden surgir pequeños hematomas que desaparecerán en 3 a 5 días.' }
                ],
                quote: "Armonía, volumen y luz para tu rostro." 
            },
        ];

        // --- LÓGICA DE NEGOCIO ---
        function sortPatients() {
            const priorityWeight = { 'red': 1, 'yellow': 2, 'green': 3 };
            patientsData.sort((a, b) => priorityWeight[a.priority] - priorityWeight[b.priority]);
        }

        function setView(newView) {
            view = newView;
            render();
            if (view === 'doctor') {
                setTimeout(initChart, 50); 
            }
        }

        function loginAsPatient(id) {
            selectedPatientId = id;
            setView('patient');
        }

        function setPriority(patientId, newPriority) {
            const patient = patientsData.find(p => p.id === patientId);
            if(patient) {
                patient.priority = newPriority;
                render(); 
                if(view === 'doctor') setTimeout(initChart, 50);
            }
        }

        function toggleFAQ(element) {
            const content = element.nextElementSibling;
            const icon = element.querySelector('svg');
            content.classList.toggle('hidden');
            icon.style.transform = content.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        // Manejador de cambio de filtros del gráfico
        function handleFilterChange() {
            chartFilters.period = document.getElementById('periodFilter').value;
            chartFilters.month = document.getElementById('monthFilter').value;
            
            const monthSelect = document.getElementById('monthFilter');
            
            // Si es anual, deshabilitamos el selector de mes porque vemos todos los meses
            if(chartFilters.period === 'anual') {
                monthSelect.disabled = true;
                monthSelect.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                monthSelect.disabled = false;
                monthSelect.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            initChart(); // Re-dibujar gráfico con nuevos datos
        }

        // --- INICIALIZAR GRÁFICO (CHART.JS) ---
        function initChart() {
            const ctx = document.getElementById('proceduresChart');
            if(!ctx) return;
            
            if(chartInstance) chartInstance.destroy();

            let labels = [];
            let data = [];
            let chartTitle = '';

            // Generamos una variación de datos basada en el mes para simular datos reales
            const monthFactor = parseInt(chartFilters.month) / 10 + 0.5; // Multiplicador dinámico

            if (chartFilters.period === 'anual') {
                labels = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                data = [120, 140, 115, 160, 185, 170, 200, 220, 190, 210, 250, 280]; // Tendencia al alza
                chartTitle = 'Total Procedimientos Anuales';
            } else if (chartFilters.period === 'mensual') {
                labels = ['Lipo Láser', 'Drawn Face', 'Armonización', 'Toxina B.', 'Lipomarcación'];
                const baseData = [45, 25, 30, 50, 15];
                data = baseData.map(val => Math.round(val * monthFactor));
                chartTitle = `Procedimientos en ${mesesNombres[parseInt(chartFilters.month) - 1]}`;
            } else if (chartFilters.period === 'semanal') {
                labels = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                const baseData = [8, 5, 12, 10, 16, 7];
                data = baseData.map(val => Math.round(val * monthFactor));
                chartTitle = `Flujo Diario (Semana Actual, ${mesesNombres[parseInt(chartFilters.month) - 1]})`;
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartTitle,
                        data: data,
                        backgroundColor: '#57534e', // stone-600
                        borderRadius: chartFilters.period === 'anual' ? 4 : 6,
                        barThickness: chartFilters.period === 'anual' ? 12 : 24
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 500,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.parsed.y} procedimientos`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { borderDash: [4, 4], color: '#f5f5f4' },
                            border: { display: false }
                        },
                        x: {
                            grid: { display: false },
                            border: { display: false }
                        }
                    }
                }
            });
        }

        // --- RENDERIZADO DE LA INTERFAZ ---
        function render() {
            const app = document.getElementById('app');
            if (view === 'login') app.innerHTML = getLoginHTML();
            else if (view === 'doctor') app.innerHTML = getDoctorHTML();
            else if (view === 'patient') app.innerHTML = getPatientHTML();
            
            lucide.createIcons();
        }

        // 1. Pantalla de Inicio (Login)
        function getLoginHTML() {
            return `
            <div class="min-h-screen flex items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80')] bg-cover bg-center">
                <div class="absolute inset-0 bg-stone-900/60 backdrop-blur-sm"></div>
                <div class="relative bg-white/95 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border border-stone-100">
                    <h1 class="text-3xl font-serif text-stone-800 mb-1">Hunza Care</h1>
                    <p class="text-stone-500 mb-8 text-sm">Portal de Seguimiento Clínico</p>
                    
                    <div class="space-y-4">
                        <button onclick="setView('doctor')" class="w-full py-3.5 px-4 bg-stone-800 text-white rounded-2xl hover:bg-stone-700 transition flex items-center justify-center gap-2 font-medium shadow-md">
                            <i data-lucide="line-chart" class="w-5 h-5"></i> Dashboard Dra. Macarena
                        </button>
                        
                        <div class="relative py-4">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200"></div></div>
                            <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-stone-400">Acceso Pacientes</span></div>
                        </div>
                        
                        <div class="grid grid-cols-1 gap-2.5">
                            ${patientsData.map(p => `
                                <button onclick="loginAsPatient(${p.id})" class="w-full py-3 px-4 bg-stone-50 text-stone-700 rounded-2xl hover:bg-stone-100 border border-stone-200 transition text-sm flex items-center justify-between font-medium">
                                    <div class="flex items-center gap-2">
                                        <div class="w-2 h-2 rounded-full ${p.priority === 'red' ? 'bg-red-500' : p.priority === 'yellow' ? 'bg-amber-400' : 'bg-emerald-500'}"></div>
                                        <span>${p.name}</span>
                                    </div>
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-stone-400"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // 2. Dashboard Dra. Macarena (Con Gráfico y Filtros)
        function getDoctorHTML() {
            sortPatients(); 
            const total = patientsData.length;
            const atencionUrgente = patientsData.filter(p => p.priority === 'red').length;
            
            return `
            <div class="min-h-screen bg-stone-50 pb-20">
                <header class="bg-white border-b border-stone-200 sticky top-0 z-20 shadow-sm">
                    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-stone-800 flex items-center justify-center text-white shadow-md">
                                <i data-lucide="stethoscope" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h2 class="font-serif font-semibold text-lg leading-tight text-stone-800">Dra. Macarena Gutiérrez</h2>
                                <p class="text-[11px] text-stone-500 uppercase tracking-wider">Directora Médica Hunza</p>
                            </div>
                        </div>
                        <button onclick="setView('login')" class="text-stone-400 hover:text-stone-700 transition p-2 bg-stone-50 rounded-full">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>

                <main class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
                    
                    <!-- Columna Izquierda: Gráficos y Resumen -->
                    <div class="w-full md:w-1/3 flex flex-col gap-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white p-5 rounded-3xl shadow-sm border border-stone-100">
                                <p class="text-xs text-stone-500 font-medium mb-1">Total Activos</p>
                                <p class="text-3xl font-serif text-stone-800">${total}</p>
                            </div>
                            <div class="bg-white p-5 rounded-3xl shadow-sm border ${atencionUrgente > 0 ? 'border-red-100 bg-red-50/20' : 'border-stone-100'}">
                                <p class="text-xs text-stone-500 font-medium mb-1">Alertas</p>
                                <p class="text-3xl font-serif ${atencionUrgente > 0 ? 'text-red-600' : 'text-stone-400'}">${atencionUrgente}</p>
                            </div>
                        </div>

                        <!-- Panel de Análisis de Datos con FILTROS -->
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-stone-100">
                            
                            <div class="flex flex-col gap-3 mb-5">
                                <h3 class="font-serif text-lg text-stone-800 flex items-center gap-2">
                                    <i data-lucide="bar-chart-3" class="w-5 h-5 text-stone-400"></i> Análisis Clínico
                                </h3>
                                
                                <div class="flex gap-2 w-full">
                                    <select id="periodFilter" onchange="handleFilterChange()" class="w-1/2 text-sm border border-stone-200 rounded-xl bg-stone-50 px-3 py-2 text-stone-700 font-medium focus:ring-2 focus:ring-stone-200 outline-none transition-all">
                                        <option value="semanal" ${chartFilters.period === 'semanal' ? 'selected' : ''}>Semanal</option>
                                        <option value="mensual" ${chartFilters.period === 'mensual' ? 'selected' : ''}>Mensual</option>
                                        <option value="anual" ${chartFilters.period === 'anual' ? 'selected' : ''}>Anual</option>
                                    </select>
                                    <select id="monthFilter" onchange="handleFilterChange()" class="w-1/2 text-sm border border-stone-200 rounded-xl bg-stone-50 px-3 py-2 text-stone-700 font-medium focus:ring-2 focus:ring-stone-200 outline-none transition-all ${chartFilters.period === 'anual' ? 'opacity-40 cursor-not-allowed' : ''}" ${chartFilters.period === 'anual' ? 'disabled' : ''}>
                                        ${mesesNombres.map((mes, idx) => `
                                            <option value="${idx + 1}" ${parseInt(chartFilters.month) === idx + 1 ? 'selected' : ''}>${mes}</option>
                                        `).join('')}
                                    </select>
                                </div>
                            </div>

                            <div class="h-56 w-full">
                                <canvas id="proceduresChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Semáforo de Pacientes -->
                    <div class="w-full md:w-2/3">
                        <h3 class="font-serif text-xl text-stone-800 mb-4 px-1">Seguimiento por Semáforo</h3>
                        
                        <div class="space-y-3">
                            ${patientsData.map(p => `
                                <div class="bg-white p-5 rounded-2xl shadow-sm border ${p.priority === 'red' ? 'border-red-200 shadow-red-100' : p.priority === 'yellow' ? 'border-amber-200' : 'border-stone-100'} flex flex-col md:flex-row gap-4 items-start md:items-center justify-between transition-all">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1.5">
                                            <h4 class="font-semibold text-stone-800 text-lg">${p.name}</h4>
                                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-stone-100 text-stone-600 uppercase truncate max-w-[200px]">${p.procedure}</span>
                                        </div>
                                        <p class="text-sm text-stone-600 mb-1 flex items-center gap-1.5 font-medium">
                                            <i data-lucide="clock" class="w-4 h-4 text-stone-400"></i> ${p.stage}
                                        </p>
                                        <p class="text-xs text-stone-400 flex items-center gap-1.5">
                                            <i data-lucide="calendar" class="w-4 h-4"></i> Próx. Control: ${p.nextControl}
                                        </p>
                                    </div>
                                    
                                    <div class="flex gap-2 p-1 bg-stone-50 rounded-full border border-stone-200 w-fit">
                                        <button onclick="setPriority(${p.id}, 'green')" class="w-10 h-10 rounded-full transition-all flex items-center justify-center ${p.priority === 'green' ? 'bg-emerald-500 shadow-md scale-110' : 'bg-white hover:bg-stone-200'}">
                                            <div class="w-3 h-3 rounded-full ${p.priority === 'green' ? 'bg-white' : 'bg-emerald-400'}"></div>
                                        </button>
                                        <button onclick="setPriority(${p.id}, 'yellow')" class="w-10 h-10 rounded-full transition-all flex items-center justify-center ${p.priority === 'yellow' ? 'bg-amber-400 shadow-md scale-110' : 'bg-white hover:bg-stone-200'}">
                                            <div class="w-3 h-3 rounded-full ${p.priority === 'yellow' ? 'bg-white' : 'bg-amber-400'}"></div>
                                        </button>
                                        <button onclick="setPriority(${p.id}, 'red')" class="w-10 h-10 rounded-full transition-all flex items-center justify-center ${p.priority === 'red' ? 'bg-red-500 shadow-md scale-110' : 'bg-white hover:bg-stone-200'}">
                                            <div class="w-3 h-3 rounded-full ${p.priority === 'red' ? 'bg-white' : 'bg-red-500'}"></div>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </main>
            </div>
            `;
        }

        // 3. Vista del Paciente (Calendario + Recordatorios)
        function getPatientHTML() {
            const p = patientsData.find(pat => pat.id === selectedPatientId);
            if(!p) return getLoginHTML();
            
            const waGeneralLink = `https://wa.me/56958049193?text=${encodeURIComponent(`Hola Clínica Hunza, soy ${p.name}. Tengo una consulta general sobre mi postoperatorio de ${p.procedure}.`)}`;
            
            let appointmentHTML = '';
            if(p.pendingAppointment) {
                const waApptLink = `https://wa.me/56958049193?text=${encodeURIComponent(`Hola Clínica Hunza, soy ${p.name}. Me gustaría agendar mi cita para: ${p.pendingAppointment}.`)}`;
                appointmentHTML = `
                <div class="bg-blue-50 border border-blue-100 p-5 rounded-3xl relative overflow-hidden mb-2">
                    <div class="absolute -right-4 -top-4 opacity-10 text-blue-500">
                        <i data-lucide="calendar-clock" class="w-32 h-32"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 text-blue-600 mb-2 font-semibold text-sm uppercase tracking-wide">
                            <i data-lucide="bell-ring" class="w-4 h-4"></i> Cita Pendiente
                        </div>
                        <h3 class="font-serif text-lg text-stone-800 mb-4">${p.pendingAppointment}</h3>
                        <a href="${waApptLink}" target="_blank" class="inline-flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-blue-700 transition shadow-md shadow-blue-200">
                            Agendar por WhatsApp <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>`;
            }

            return `
            <div class="min-h-screen bg-stone-50 flex flex-col pb-6">
                <header class="bg-white/90 backdrop-blur-md sticky top-0 z-20 border-b border-stone-100 shadow-sm">
                    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
                        <div class="font-serif font-semibold text-stone-800 tracking-wide text-lg flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4 text-stone-400"></i> Hunza Care
                        </div>
                        <button onclick="setView('login')" class="text-stone-400 hover:text-stone-700 transition p-2 bg-stone-50 rounded-full">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </header>

                <main class="max-w-md mx-auto w-full flex-1 px-4 py-6 flex flex-col gap-8">
                    
                    <div>
                        <p class="text-stone-500 text-sm mb-1 font-medium">Evolución de</p>
                        <h1 class="font-serif text-3xl text-stone-800 mb-4">${p.name}</h1>
                        
                        <div class="bg-stone-800 text-white p-6 rounded-[2rem] shadow-lg relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 opacity-10"><i data-lucide="activity" class="w-40 h-40"></i></div>
                            <div class="relative z-10">
                                <p class="text-stone-300 text-[10px] uppercase tracking-widest font-semibold mb-1">Procedimiento</p>
                                <h2 class="text-xl font-serif mb-4 leading-tight">${p.procedure}</h2>
                                <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-sm font-medium border border-white/10">
                                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                                    ${p.stage}
                                </div>
                            </div>
                        </div>
                    </div>

                    ${appointmentHTML}

                    <!-- CALENDARIO GRÁFICO HORIZONTAL SCROLLABLE -->
                    <div class="relative">
                        <div class="flex justify-between items-end mb-3 px-1">
                            <h3 class="font-serif text-lg text-stone-800 flex items-center gap-2">
                                <i data-lucide="calendar-check" class="w-5 h-5 text-stone-400"></i> Línea de Tiempo
                            </h3>
                        </div>
                        
                        <!-- Contenedor scrollable -->
                        <div class="flex overflow-x-auto gap-4 pb-4 px-1 no-scrollbar snap-x cursor-grab active:cursor-grabbing">
                            ${p.milestones.map((m, idx) => `
                                <div class="snap-center shrink-0 w-60 bg-white p-5 rounded-3xl border ${m.completed ? 'border-stone-800 shadow-md' : 'border-stone-200 opacity-70'} relative">
                                    ${m.completed ? '<div class="absolute -top-2 -right-2 bg-stone-800 text-white p-1.5 rounded-full shadow-sm"><i data-lucide="check" class="w-3 h-3"></i></div>' : ''}
                                    <span class="text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1.5 block">${m.day}</span>
                                    <h4 class="font-serif font-semibold text-stone-800 mb-2 leading-tight">${m.title}</h4>
                                    <p class="text-sm text-stone-500 leading-relaxed">${m.desc}</p>
                                    
                                    ${idx < p.milestones.length - 1 ? `<div class="absolute top-1/2 -right-4 w-4 h-[2px] ${m.completed ? 'bg-stone-800' : 'bg-stone-200'}"></div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-[10px] text-stone-400 text-center flex items-center justify-center gap-1 mt-1">
                            <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Desliza para ver más
                        </p>
                    </div>

                    <!-- PREGUNTAS FRECUENTES -->
                    <div>
                        <h3 class="font-serif text-lg text-stone-800 mb-3 px-1 flex items-center gap-2">
                            <i data-lucide="help-circle" class="w-5 h-5 text-stone-400"></i> Cuidados y Dudas
                        </h3>
                        <div class="space-y-2">
                            ${p.faqs.map(faq => `
                                <div class="bg-white border border-stone-200 rounded-2xl overflow-hidden">
                                    <button onclick="toggleFAQ(this)" class="w-full px-5 py-4 text-left flex justify-between items-center bg-white hover:bg-stone-50 transition">
                                        <span class="font-medium text-sm text-stone-800 pr-4">${faq.q}</span>
                                        <i data-lucide="chevron-down" class="w-4 h-4 text-stone-400 transition-transform duration-300"></i>
                                    </button>
                                    <div class="hidden px-5 pb-4 text-sm text-stone-500 leading-relaxed border-t border-stone-100 pt-3 bg-stone-50/50">
                                        ${faq.a}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="text-center px-6 py-4 bg-stone-100 rounded-3xl mt-2">
                        <p class="font-serif italic text-stone-600 text-sm">"${p.quote}"</p>
                    </div>

                    <a href="${waGeneralLink}" target="_blank" class="mt-2 w-full bg-white border-2 border-[#25D366] text-[#25D366] p-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-green-50 transition-all active:scale-[0.98] font-semibold">
                        <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                        Tengo una duda general
                    </a>
                </main>
            </div>
            `;
        }

        render();
    </script>
</body>
</html>
